<title>BlockyAI</title><link rel="stylesheet" href="style.css"></head><body>
<div id="auth" class="card center"><h1>BlockyAI</h1><p class="mut">AI that builds in Roblox Studio</p>
<input id="email" type="email" placeholder="email"><input id="pw" type="password" placeholder="password (min 6)">
<div class="row"><button id="login">Sign in</button><button id="signup" class="ghost">Create account</button></div><p id="autherr" class="err"></p></div>
<div id="app" hidden>

<main>
 <header><div id="title">No session</div>
  <div class="badges"><span id="vmbadge" class="badge">VM: none</span><span id="plbadge" class="badge">Studio: offline</span><span id="agbadge" class="badge">Agent: idle</span>
  <button id="vmstart" class="sm">Start VM</button><button id="vmrestart" class="sm ghost">Restart VM</button><button id="vmstop" class="sm ghost">Suspend</button></div></header>
 <div id="pair" class="banner" hidden></div>
 <div id="chat"></div>
 <form id="form"><input id="msg" placeholder="Tell BlockyAI what to build..." autocomplete="off"><button>Send</button></form>
</main></div>
